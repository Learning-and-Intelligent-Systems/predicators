# Canonical menu of approaches (the "arms"). Every approach is defined here
# exactly once and parked with SKIP: True by default. Thin launcher configs
# (oracle.yaml, exp_*.yaml) include this file and only flip the
# SKIP of the arm(s) they want to run, plus any per-experiment ENVS overrides.
#
# Arms are grouped by how much ground truth (GT) they are handed vs. what they
# must learn, forming a ladder from most-oracle (upper bound) down to the
# weakest baselines:
#   OURS         - the method: PO, no GT; learn predicates + hybrid sim + params
#   ORACLES      - given a GT world model (GT sim / params); upper bounds,
#                  ablations of OURS, and the oracle-sim agent_planner baseline
#   BASELINES    - lower bounds (no world model or no learning)
#   DEMONSTRATOR - the demo source (oracle process planning) + scripted/manual
#
# Merge note: launchers override scalars cleanly ({SKIP: False}), but the
# include merge CONCATENATES lists. Keep list-valued FLAGS (e.g.
# agent_sim_learn_kept_predicates_names) defined here and do not
# try to override them from a launcher.
APPROACHES:

  # ======================================================================
  # OURS
  # ======================================================================
  # Ours: partially observable, no GT; learn predicates, hybrid sim, and
  # params (LLM proposes initial params). Includes the physics-margin
  # capture gate: captures must also survive +-1-posterior-sigma
  # perturbations of the identified physical params (sigma = the sysID
  # fit's reported width, floored by
  # code_sim_learning_rollout_min_posterior_width). Motivated by
  # run_20260723_091108 seed1: a capture validated 8/8 at fitted
  # lateral_friction 0.5319 failed deterministically at true 0.5 - the
  # execution-validation repeats cannot see zero margin to parameter
  # error.
  agent_po_predicate_invention_al:
    NAME: "agent_po_sim_predicate_invention"
    SKIP: True
    FLAGS:
      demonstrator: "oracle_process_planning"
      explorer: "agent_bilevel"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      agent_sim_learn_kept_predicates_names: ["Holding"]
      partially_observable: True
      agent_explorer_info_seeking: True
      execution_monitor: "subgoal_annotations"
      agent_bilevel_max_execution_replans: 2
      agent_bilevel_use_llm_initial_params: True # LLM proposes params
      agent_sdk_max_agent_turns_per_iteration: 200
      agent_sdk_image_max_px: 900
      agent_planner_use_explore_python: True
      agent_solve_max_attempts: 5
      agent_solve_attempt_wall_clock: 2700
      agent_solve_fresh_context: True
      agent_solve_use_journal: True
      agent_plan_validation_physics_margin: True
      code_sim_learning_rollout_min_posterior_width: 0.1

  # ======================================================================
  # ORACLES  (given a GT world model; the two GT-mono-sim arms first (with vs
  #           without the refine_plan_sketch tool), then the GT-hybrid-sim
  #           ladder ordered from most GT handed in down to least)
  # ======================================================================
  # Oracle: GT monolithic sim as world model + GT predicates. Even with
  # use_llm_initial_params False the LLM delivers a full, concrete,
  # exact-parameter plan and validates it in the sim via
  # evaluate_option_plan -- there is no approach-side backtracking
  # fallback. What it adds over
  # agent_model_based_planning is the refine_plan_sketch tool (an agent-invokable
  # per-step backtracking parameter search) plus the sketch / per-step-subgoal
  # scaffolding. Paired with agent_model_based_planning below: same oracle GT
  # mono sim, the difference is that extra tooling.
  agent_oracle_mono_sim:
    NAME: "agent_bilevel"
    SKIP: True
    FLAGS:
      explorer: "agent_plan"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: True
      agent_bilevel_log_state: False
      agent_bilevel_plan_sketch_file: "tests/approaches/test_data/boil_plan_sketch.txt"
  # Oracle-sim baseline: SAME GT monolithic sim as agent_oracle_mono_sim and,
  # under these defaults, the LLM likewise delivers a full concrete plan via
  # evaluate_option_plan. The difference is the tooling: agent_planner has NO
  # refine_plan_sketch, so the LLM must find working continuous params itself
  # using only whole-plan simulation (evaluate_option_plan) + inspection -- no
  # per-step backtracking search and no sketch/subgoal scaffolding. This isolates
  # the effect of that tooling under identical oracle dynamics; its no-sim
  # counterpart is agent_model_free_planning in BASELINES.
  agent_model_based_planning:
    NAME: "agent_planner"
    SKIP: True
    FLAGS:
      explorer: "agent_plan"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
  # Oracle (upper bound): GT hybrid sim + GT base-sim physical params
  # (true friction), as if all learning had already succeeded.
  # Includes the 200-turn sandbox budget (2026-07-15 sweeps: every failed
  # test episode exhausted the default 50-turn budget), explore_python,
  # and the solve restart loop: up to 5 time-boxed (45 min) attempts,
  # each on a fresh conversation, with cross-attempt knowledge travelling
  # through the solve journal (run_20260717_23xx family split: the same
  # tasks solved in 9-32 min or burned 2-11 h anchored on wrong
  # conclusions, so several short independent attempts beat one long one).
  agent_oracle_hybrid_sim:
    NAME: "agent_sim_learning"
    SKIP: True
    FLAGS:
      demonstrator: "oracle_process_planning"
      bilevel_plan_without_sim: True # for the demonstrator
      explorer: "agent_bilevel"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: False
      agent_bilevel_log_state: False
      agent_sim_learn_oracle_sim_program: True
      agent_sim_learn_oracle_sim_params: True
      agent_bilevel_use_llm_initial_params: True
      num_online_learning_cycles: 0
      execution_monitor: "subgoal_annotations"
      agent_bilevel_max_execution_replans: 2
      agent_sdk_max_agent_turns_per_iteration: 200
      agent_sdk_image_max_px: 900
      agent_planner_use_explore_python: True
      agent_solve_max_attempts: 5
      agent_solve_attempt_wall_clock: 2700
      agent_solve_fresh_context: True
      agent_solve_use_journal: True
  # Oracle: GT hybrid sim + GT predicates; learn only the params.
  agent_param_learning:
    NAME: "agent_sim_learning"
    SKIP: True
    FLAGS:
      explorer: "agent_bilevel"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: True
      agent_bilevel_log_state: False
      agent_bilevel_plan_sketch_file: "tests/approaches/test_data/boil_plan_sketch.txt"
      agent_sim_learn_oracle_sim_program: True
      agent_sim_learn_oracle_sim_params: False
      agent_sim_learn_oracle_sim_param_noise_scale: 1.0 # 1.0 allows successful planning but insatisficing plan; 0.8 produces satisficing plan
      code_sim_learning_num_mcmc_steps: 0
  # agent_oracle_hybrid_sim + agent-synthesized per-skill samplers: the
  # agent writes samplers.py (LEARNED_SAMPLERS) in a dedicated synthesis
  # session, and bilevel refinement then draws each option's params from
  # its sampler instead of uniformly (per-step `~ [widths]` regions still
  # override per step). Compare against agent_oracle_hybrid_sim to
  # measure what the reusable cross-task sampler prior adds.
  agent_oracle_hybrid_sim_sampler:
    NAME: "agent_sim_learning"
    SKIP: True
    FLAGS:
      demonstrator: "oracle_process_planning"
      bilevel_plan_without_sim: True # for the demonstrator
      explorer: "agent_bilevel"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: False
      agent_bilevel_log_state: False
      agent_sim_learn_oracle_sim_program: True
      agent_sim_learn_oracle_sim_params: True
      agent_bilevel_use_llm_initial_params: True
      num_online_learning_cycles: 0
      execution_monitor: "subgoal_annotations"
      agent_bilevel_max_execution_replans: 2
      agent_sim_learn_parameterized_samplers: True
  # agent_oracle_hybrid_sim + GROUND samplers: the agent may attach a
  # per-step sampling prior to any sketch step - a uniform window
  # `~ [w1, w2]` around its proposed params, or `~ name` referencing a
  # function it wrote in ground_samplers.py (reloaded on every
  # refine_plan_sketch call). No learning session; the channel is pure
  # sketch grammar, enabled by agent_bilevel_ground_samplers. Compare
  # against agent_oracle_hybrid_sim (which never sees the grammar) to
  # measure what per-call ground sampling adds.
  agent_oracle_hybrid_sim_ground_sampler:
    NAME: "agent_sim_learning"
    SKIP: True
    FLAGS:
      demonstrator: "oracle_process_planning"
      bilevel_plan_without_sim: True # for the demonstrator
      explorer: "agent_bilevel"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: False
      agent_bilevel_log_state: False
      agent_sim_learn_oracle_sim_program: True
      agent_sim_learn_oracle_sim_params: True
      agent_bilevel_use_llm_initial_params: True
      num_online_learning_cycles: 0
      execution_monitor: "subgoal_annotations"
      agent_bilevel_max_execution_replans: 2
      agent_bilevel_ground_samplers: True
  # Oracle: GT predicates; learn the hybrid sim and its params.
  agent_sim_learning:
    NAME: "agent_sim_learning"
    SKIP: True
    FLAGS:
      explorer: "agent_bilevel"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: True
      agent_bilevel_log_state: False
      agent_bilevel_plan_sketch_file: "tests/approaches/test_data/boil_plan_sketch.txt"
      agent_sim_learn_oracle_sim_program: False
      agent_sim_learn_oracle_sim_params: False
      code_sim_learning_num_mcmc_steps: 0
  # Oracle / fully-observable ablation of OURS: sees full state, no GT models;
  # learn predicates, hybrid sim, and params.
  agent_predicate_invention:
    NAME: "agent_sim_predicate_invention"
    SKIP: True
    FLAGS:
      explorer: "agent_bilevel"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: False
      agent_bilevel_log_state: False
      online_learning_early_stopping: True
      agent_sim_learn_oracle_sim_program: False
      agent_sim_learn_oracle_sim_params: False
      code_sim_learning_num_mcmc_steps: 0
      agent_sim_learn_kept_predicates_names: ["Holding"]

  # ======================================================================
  # BASELINES  (lower bounds / alternative learners)
  # ======================================================================
  # Baseline: agent planning does NOT have a simulator / world model. This is
  # the no-model counterpart of agent_model_based_planning (same agent_planner
  # approach, but agent_planner_use_simulator: False).
  agent_model_free_planning:
    NAME: "agent_planner"
    SKIP: True
    FLAGS:
      explorer: "agent_plan"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      agent_planner_use_simulator: False
  # Baseline (no learning): our pipeline on the base sim with LLM initial
  # params but no param learning (agent_sim_learn_oracle_sim_params False).
  agent_base_sim_no_learning:
    NAME: "agent_sim_learning"
    SKIP: True
    FLAGS:
      demonstrator: "oracle_process_planning"
      bilevel_plan_without_sim: True # for the demonstrator
      explorer: "agent_bilevel"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True
      option_model_terminate_on_repeat: False
      option_model_use_gui: False
      agent_bilevel_log_state: False
      agent_sim_learn_oracle_sim_program: True
      agent_sim_learn_oracle_sim_params: False
      agent_bilevel_use_llm_initial_params: True
      num_online_learning_cycles: 0
      execution_monitor: "subgoal_annotations"
      agent_bilevel_max_execution_replans: 2
  # Baseline: learn options from demonstrations.
  agent_option_learning:
    NAME: "agent_option_learning"
    SKIP: True
    FLAGS:
      explorer: "agent_plan"
      option_learner: "agent"
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      agent_sdk_use_local_sandbox: True

  # ======================================================================
  # DEMONSTRATOR / SCRIPTED  (demo source used by every agent arm above,
  #                           also runnable standalone; + manual control)
  # ======================================================================
  # Oracle: process planning + bilevel refinement with GT models. This is the
  # `demonstrator` every agent arm consumes; oracle.yaml runs it standalone.
  oracle:
    NAME: "oracle_process_planning"
    SKIP: True
    FLAGS:
      demonstrator: "oracle_process_planning"
      terminate_on_goal_reached_and_option_terminated: True
      sesame_check_expected_atoms: False
      bilevel_plan_without_sim: True
  # Scripted human-in-the-loop option control (manual baseline).
  human_interaction:
    NAME: "human_interaction"
    SKIP: True
    FLAGS:
      human_option_control_approach_use_scripted_option: True
      human_option_control_approach_use_all_options: True
      scripted_option_dir: "scripted_option_policies"
      skill_phase_use_motion_planning: True
      terminate_on_goal_reached_and_option_terminated: True
