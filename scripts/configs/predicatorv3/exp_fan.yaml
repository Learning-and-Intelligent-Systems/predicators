# Thin launcher: run the fan experiment (agent_oracle_hybrid_sim arm).
# Usage: python scripts/local/launch_simp.py -c predicatorv3/exp_fan.yaml --parallel
# Env definitions live in envs/all.yaml and approach definitions in
# approaches/all.yaml (all parked by default); this file only un-skips the
# env + arm(s) it runs. To run a baseline sweep, flip additional arms'
# SKIP to False here.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  fan:
    SKIP: False
  # fan has no agent-specific excluded_predicates. The grid predicates
  # (BallAtLoc / ClearLoc / SideOf / FanFacingSide / OppositeFan) are
  # helper-only (injected for the oracle), so they are not in env.predicates
  # and the agent already runs grid-free over the physical vocabulary.
APPROACHES:
  agent_oracle_hybrid_sim:
    SKIP: True
  agent_po_predicate_invention_al:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      # Ablation axis: surface the fan env's base-sim source
      # (pybullet_fan_base.py + pybullet_env.py) in the agent sandbox's
      # ./reference/base_sim/. The wind dynamics, task generation, and
      # goal semantics live in pybullet_fan.py, which is never provided.
      agent_sim_provide_base_sim_source: True
