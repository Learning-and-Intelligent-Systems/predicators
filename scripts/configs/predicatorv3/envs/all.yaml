  #   NAME: "pybullet_boil"
  #   FLAGS:
  #     max_initial_demos: 1
  #     excluded_objects_in_state_str: "switch"
  #     max_num_steps_option_rollout: 100
  #     horizon: 500
  #     boil_goal: "simple"
  #     boil_require_jug_full_to_heatup: True
  #     script_option_file_name: "boil.txt"
  #     boil_water_fill_speed: 0.0015
  #     pybullet_birrt_path_subsample_ratio: 2
  #     boil_num_jugs_test: [1]
  fan:
    NAME: "pybullet_fan"
    # Parked by default; exp_fan.yaml and oracle.yaml un-skip it.
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "switch"
      terminate_on_goal_reached: True
      process_planning_heuristic_weight: 10.0
      horizon: 500
      pybullet_birrt_path_subsample_ratio: 2
      # Safety net only: with the asymmetric toggle delays in
      # fan/processes.py (TurnFanOff mu=1) the oracle solves 5/5 and
      # demos generate with zero replans; keep a small budget for the
      # agent arms, whose learned models can still misjudge drift.
      process_planning_max_execution_replans: 3
  bridge:
    NAME: "pybullet_bridge"
    # Parked by default; exp_bridge.yaml un-skips it.
    SKIP: True
    FLAGS:
      max_initial_demos: 1
      horizon: 3000
      # Required for the "full" spec (7 blocks / 6 joints): unweighted
      # skeleton search times out; with weight 10 plans land in ~1.5 s.
      process_planning_heuristic_weight: 10.0
      bridge_task_spec_train: ["simple"]
      bridge_task_spec_test: ["simple"]
      # The two seat joints cure a few physics steps apart, but each
      # Wait ends on the FIRST atom change, so the tail of a multi-cure
      # plan routinely needs a cheap replan-from-current-state (which
      # reduces to "Wait until the remaining joint cures").
      process_planning_max_execution_replans: 3
      # Bail out of a Wait that sees no atom change (the awaited cure
      # can complete DURING the previous option, stranding the Wait).
      # Longest legitimate wait: cure_threshold (25) + cure-start
      # stagger across the preceding option (~60 steps).
      wait_option_max_steps: 120
      # Bridge NEEDS validated IK (common.yaml turns it off): placement
      # accuracy feeds the cure gates, and lateral placement error is
      # frozen into the weld.
      pybullet_ik_validate: True
      # The packed full-variant staging grid leaves ~1-2 cm clearances
      # that stochastically dip into 2-3 mm grazes; the default 1 mm
      # margin turns those into unrecoverable BiRRT start/goal
      # rejections.
      pybullet_birrt_contact_margin: -0.005
      pybullet_birrt_path_subsample_ratio: 2
