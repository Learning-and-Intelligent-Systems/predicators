[mypy]
strict_equality = True
disallow_untyped_calls = True
warn_unreachable = True
# docs/ holds one-off slide/figure-generation scripts, not library code.
# submodules/ holds git submodules, which are checked in their own repos.
exclude = (predicators/envs/assets|venv|prompts|logs|docs|submodules)

[mypy-predicators.*]
disallow_untyped_defs = True

[mypy-scripts.*]
disallow_untyped_defs = True

# macOS-only launch helpers: the `sys.platform != "darwin"` guard makes the
# rest of the function dead code under mypy's Linux (CI) platform analysis.
[mypy-scripts.local.launch]
warn_unreachable = False

[mypy-scripts.local.launch_simp]
warn_unreachable = False

[mypy-predicators.tests.*]
ignore_missing_imports = True

[mypy-predicators.third_party.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-gym.spaces.*]
ignore_missing_imports = True

[mypy-imageio.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-bddl.*]
ignore_missing_imports = True

[mypy-igibson.*]
ignore_missing_imports = True

[mypy-tabulate.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-dill.*]
ignore_missing_imports = True

[mypy-pyperplan.*]
ignore_missing_imports = True

[mypy-pybullet.*]
ignore_missing_imports = True

[mypy-pathos.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-graphlib.*]
ignore_missing_imports = True

[mypy-pybullet_utils.*]
# utils provided by pybullet itself don't have typing stubs
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-open3d.*]
ignore_missing_imports = True

[mypy-smepy.*]
ignore_missing_imports = True

[mypy-pyrealsense2.*]
ignore_missing_imports = True

[mypy-panda_robot_client.*]
ignore_missing_imports = True

[mypy-gym.*]
ignore_missing_imports = True

[mypy-gym_sokoban.*]
ignore_missing_imports = True

[mypy-gymnasium.*]
ignore_missing_imports = True

[mypy-gymnasium_robotics.*]
ignore_missing_imports = True

[mypy-ImageHash.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-google.generativeai.*]
ignore_missing_imports = True

# BabyRobotPredicator (submodules/BabyRobotPredicator) is a PRIVATE submodule
# and is deliberately not in install_requires, so it is absent on CI and on any
# checkout without access. This stanza covers both cases: the import is ignored
# when the package is missing, and its (separately type-checked) internals are
# not re-checked here when it is present.
[mypy-babyrobot.*]
ignore_missing_imports = True
follow_imports = skip

# Same submodule, second top-level package: the ZED recorder and the markerless
# pose pipeline live under pose_estimation/ rather than babyrobot/, so they need
# their own stanza for exactly the same reason.
[mypy-pose_estimation.*]
ignore_missing_imports = True
follow_imports = skip
